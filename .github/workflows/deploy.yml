name: Build and Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/bbq-knives
  DROPLET_IP: 209.38.205.122
  DEPLOY_PATH: /opt/bbq-knives

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }} \
                       -t ${{ env.IMAGE_PREFIX }}-backend:latest \
                       ./backend
          docker push ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}-backend:latest

      - name: Build and push storefront image
        run: |
          # Use secret if set, otherwise use placeholder for build
          PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}"
          if [ -z "$PUBLISHABLE_KEY" ]; then
            PUBLISHABLE_KEY="pk_build_placeholder_key"
          fi

          docker build -t ${{ env.IMAGE_PREFIX }}-storefront:${{ github.sha }} \
                       -t ${{ env.IMAGE_PREFIX }}-storefront:latest \
                       --build-arg MEDUSA_BACKEND_URL=http://backend:9000 \
                       --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
                       --build-arg NEXT_PUBLIC_BASE_URL=http://${{ env.DROPLET_IP }}:8000 \
                       --build-arg NEXT_PUBLIC_DEFAULT_REGION=de \
                       ./storefront
          docker push ${{ env.IMAGE_PREFIX }}-storefront:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}-storefront:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Droplet
        run: |
          # Pass the PAT securely via SSH
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} "
            set -e

            cd /opt/bbq-knives

            # Pull latest changes (for docker-compose and scripts)
            git fetch origin main
            git reset --hard origin/main

            # Login to GitHub Container Registry
            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u renato-dransay --password-stdin

            # Pull new images and restart
            docker compose -f docker-compose.prod.yml pull

            # Start database containers first
            docker compose -f docker-compose.prod.yml up -d postgres redis

            # Wait for postgres to be healthy
            echo 'Waiting for database to be ready...'
            sleep 10

            # Test database connectivity
            echo 'Testing database connectivity...'
            docker compose -f docker-compose.prod.yml run --rm backend sh -c 'echo \"DATABASE_URL starts with: \${DATABASE_URL:0:30}...\"'

            # Run database migrations
            echo 'Running database migrations...'
            docker compose -f docker-compose.prod.yml run --rm backend npx medusa db:migrate 2>&1 || {
              echo '=== Initial migration failed - this is expected on first deploy ==='
              echo 'Tables will be created when the backend starts'
            }
            echo 'Migration step completed'

            # Start all containers - don't fail immediately, capture logs on error
            if ! docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 180; then
              echo '=== DEPLOYMENT FAILED - Container logs ==='
              echo '=== Backend logs ==='
              docker logs bbq_backend --tail 100 2>&1 || true
              echo '=== Storefront logs ==='
              docker logs bbq_storefront --tail 100 2>&1 || true
              echo '=== Container status ==='
              docker ps -a
              exit 1
            fi

            # Cleanup old images
            docker image prune -f

            echo 'Deployment complete!'
          "

      - name: Health Check
        run: |
          echo "Waiting for services to start..."
          sleep 30
          curl -f http://${{ env.DROPLET_IP }}:8000 || echo "Storefront health check warning"
          curl -f http://${{ env.DROPLET_IP }}:9000/health || echo "Backend health check warning"
